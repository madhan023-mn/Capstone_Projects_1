services:
  - type: web
    name: capstone-collab-ws
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm install
    startCommand: npm run collab
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COLLAB_PORT
        value: 10000
      - key: COLLAB_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
